<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verified tasks</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Verified tasks</h1>
    <p>Terminal-Bench-style tasks in Harbor format, with hidden graders.</p>
  </header>
  <main>
    <nav aria-label="Tasks">
      <ul id="task-list"><li class="muted">Loading…</li></ul>
    </nav>
    <section id="detail" aria-live="polite">
      <p class="muted">Choose a task to see its statement and results.</p>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
